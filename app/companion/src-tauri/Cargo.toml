[package]
name = "foldscan-companion"
version = "0.1.0"
edition = "2021"
description = "FoldScan local-first desktop companion shell (Tauri 2 scaffold)"
license = "MIT"

# See version constraints: exact `=` pins, matching the app/domain convention.
# `tauri` is pinned to the 2.x line tested in CI; the build script crate is
# pinned alongside it.
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
foldscan-domain = { path = "../../domain" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.141"
tauri = { version = "=2.11.6", features = [] }
# Keep the dialog plugin on its final `tauri-plugin-fs = 2.5.0`-compatible
# release. fs 2.5.1+ selects toml 1.x, whose Serde floor conflicts with the
# repository's exact 1.0.219 pin.
tauri-plugin-dialog = "=2.7.0"
tauri-plugin-fs = "=2.5.0"

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
